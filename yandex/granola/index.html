<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Open Granola on Yandex</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24251f;
      background: #f7f5ee;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      width: min(100%, 420px);
      padding: 32px 24px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(50, 44, 28, 0.12);
      text-align: center;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: #ffdc34;
      font-size: 24px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    p {
      margin: 0 0 22px;
      color: #6c6b62;
      line-height: 1.5;
    }

    .note {
      margin: 14px 0 0;
      font-size: 14px;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      background: #ffdc34;
      color: #191a17;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">Y</div>
    <h1>Open granola on Yandex</h1>
    <p>On iPhone, tap the yellow button so WhatsApp keeps the Yandex search.</p>
    <form id="yandexGranolaSearch" method="get" action="https://eda.yandex.kg/en-kg/search">
      <input type="hidden" name="query" value="Kyrgyz Organic гранола">
      <button type="submit">Open granola on Yandex</button>
    </form>
    <p class="note">Yandex should open with “Kyrgyz Organic гранола” already entered.</p>
  </main>
</body>
</html>
