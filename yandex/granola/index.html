<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Open Granola on Yandex</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24251f;
      background: #f7f5ee;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      width: min(100%, 420px);
      padding: 32px 24px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(50, 44, 28, 0.12);
      text-align: center;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: #ffdc34;
      font-size: 24px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    p {
      margin: 0 0 22px;
      color: #6c6b62;
      line-height: 1.5;
    }

    .note {
      margin: 14px 0 0;
      font-size: 14px;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      background: #ffdc34;
      color: #191a17;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">Y</div>
    <h1>Open granola on Yandex</h1>
    <p>Tap below to copy the search. In Yandex, tap its search box and choose Paste.</p>
    <button id="copyAndOpen" type="button">Copy search &amp; open Yandex</button>
    <p class="note" id="status">Search phrase: “Kyrgyz Organic гранола”</p>
  </main>

  <script>
    document.getElementById('copyAndOpen').addEventListener('click', async function () {
      var button = this;
      var status = document.getElementById('status');
      try {
        await navigator.clipboard.writeText('Kyrgyz Organic гранола');
        status.textContent = 'Copied. In Yandex, tap the search box and choose Paste.';
        button.textContent = 'Copied — opening Yandex…';
        window.setTimeout(function () {
          window.location.assign('https://eda.yandex.kg/en-kg/');
        }, 700);
      } catch (error) {
        status.textContent = 'Copy failed. Open the full granola chooser and use its Copy button.';
        window.location.assign('https://oako.kg/yandex/?v=5');
      }
    });
  </script>
</body>
</html>
