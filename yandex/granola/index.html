<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Open Granola on Yandex</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24251f;
      background: #f7f5ee;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      width: min(100%, 420px);
      padding: 32px 24px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(50, 44, 28, 0.12);
      text-align: center;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: #ffdc34;
      font-size: 24px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    p {
      margin: 0 0 22px;
      color: #6c6b62;
      line-height: 1.5;
    }

    .note {
      margin: 14px 0 0;
      font-size: 14px;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      background: #ffdc34;
      color: #191a17;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .app-link {
      width: 100%;
      min-height: 52px;
      border-radius: 16px;
      background: #ffdc34;
      color: #191a17;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 750;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">Y</div>
    <h1>Open granola on Yandex</h1>
    <p>Tap below to copy the search and open Food in Yandex Go. Close any offer, tap Search, then Paste.</p>
    <a class="app-link" id="copyAndOpen" href="https://8jxm.adj.st/external?adj_deeplink=yandextaxi%3A%2F%2Fexternal%3Fservice%3Deats&amp;adjust_t=gm2aavy&amp;service=eats">Copy search &amp; open Yandex Go</a>
    <p class="note" id="status">Search phrase: “Kyrgyz Organic гранола”</p>
  </main>

  <script>
    var query = 'Kyrgyz Organic гранола';
    var nativeTarget = new URL('yandextaxi://external');
    nativeTarget.searchParams.set('service', 'eats');
    var appLink = new URL('https://8jxm.adj.st/external');
    appLink.searchParams.set('adj_deeplink', nativeTarget.toString());
    appLink.searchParams.set('adjust_t', 'gm2aavy');
    appLink.searchParams.set('service', 'eats');

    var openLink = document.getElementById('copyAndOpen');
    openLink.href = appLink.toString();
    openLink.addEventListener('click', function () {
      var status = document.getElementById('status');
      var input = document.createElement('textarea');
      input.value = query;
      input.setAttribute('readonly', '');
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      input.setSelectionRange(0, input.value.length);
      var copied = false;
      try { copied = document.execCommand('copy'); } catch (error) {}
      input.remove();
      status.textContent = copied
        ? 'Copied. Opening Yandex Go…'
        : 'Opening Yandex Go. If search is not open, return and copy the phrase above.';
    });
  </script>
</body>
</html>
